name: Update data

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC; NSIDC and GML post the previous day overnight (US time)
    - cron: '47 13 * * *'  # backup slots: GitHub dropped the single daily slot on 2026-10-03 and 2026-10-04.
    - cron: '23 21 * * *'  # Extra runs are no-ops unless data changed (publish only on change; concurrency queues them)
  workflow_dispatch:
    inputs:
      memo:
        description: 'Why this run (required)'
        required: true
        type: string
      sst_backfill_from:
        description: 'Recompute SST from this year (e.g. 1981). Empty = current year only'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish a new Kaggle version when data changed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # The branch tip, not the triggering commit: a run queued behind another must see the data
      # that run committed, or it compares against stale history and its push is rejected.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # enough history for `git log -- data/` to find the last data commit (named in the Kaggle notes)
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test the downloader (404, dropped connections, file replaced mid-download)
        run: python scripts/test_get.py

      - name: Test the derived columns (pre-industrial offset, ENSO episodes, CPC table parser, forcing)
        run: python scripts/test_derived.py

      # Gates run inside build.py; any failure exits non-zero before data/ is touched.
      # Exit 75 means a source could not be reached after the retries. A scheduled run then ends with a
      # warning instead of a failure while the data are under 48 hours old, since the next run (three a
      # day) retries; past that, or on a manual run, it fails.
      - name: Build and gate
        id: build
        env:
          SST_FROM: ${{ inputs.sst_backfill_from }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ -n "$SST_FROM" ]; then args+=(--sst-backfill-from "$SST_FROM"); fi
          rc=0
          python scripts/build.py "${args[@]}" || rc=$?
          if [ "$rc" = 75 ] && [ "$EVENT" = schedule ]; then
            age_h=$(( ($(date +%s) - $(git log -1 --format=%ct -- data/)) / 3600 ))
            if [ "$age_h" -lt 48 ]; then
              echo "::warning title=source unreachable::A source could not be reached; data/ was last updated ${age_h} h ago and the next scheduled run retries."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=source unreachable::A source could not be reached and data/ has not been updated for ${age_h} h."
          fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          # file and column descriptions are regenerated from the data just written; this fails if a
          # described column and the CSV header disagree, so a schema change cannot ship undescribed
          python scripts/make_kaggle_meta.py
          cp kaggle/dataset-metadata.json _build/dataset-metadata.json

      - name: Commit data
        id: commit
        if: steps.build.outputs.skipped != 'true'
        run: |
          git add data/ kaggle/dataset-metadata.json kaggle/settings.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Scheduled runs publish only after the repository variable KAGGLE_PUBLISH is set to true,
      # and only when the latest Kaggle version is not the data committed here (its notes name the
      # commit). So a failed upload is retried by the next scheduled run, not only when data changes
      # again. A manual run with publish=true always publishes the current build.
      - name: Check whether Kaggle has this data
        id: kaggle
        if: github.event_name == 'schedule' && vars.KAGGLE_PUBLISH == 'true' && steps.build.outputs.skipped != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle==2.2.4
          python scripts/kaggle_published.py yasunorim/earth-vital-signs-daily "$(git log -1 --format=%h -- data/ kaggle/dataset-metadata.json kaggle/settings.json)"

      - name: Publish Kaggle version
        if: inputs.publish || steps.kaggle.outputs.behind == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle==2.2.4
          set -o pipefail
          # the version number before this upload, so the next step can wait for the new one.
          # The CLI prints notices such as "Warning: ... outdated `kaggle` version" to stdout ahead of
          # the JSON, so only the JSON line goes to jq.
          prev=$(kaggle datasets status --format 'json(current_version_number)' yasunorim/earth-vital-signs-daily | grep '^{' | jq -er .current_version_number)
          echo "KAGGLE_PREV_VERSION=$prev" >> "$GITHUB_ENV"
          commit=$(git log -1 --format=%h -- data/ kaggle/dataset-metadata.json kaggle/settings.json)
          kaggle datasets version -p _build -m "Data through $(jq -r '.sst_daily.last_date' data/summary.json) (commit $commit)" --dir-mode zip 2>&1 | tee kaggle.log
          # the CLI can print a rejected upload and still exit 0
          if grep -qiE "error|unsuccessful" kaggle.log; then exit 1; fi

      # The records and year-to-date notebooks read the latest dataset version, so they are re-run once
      # that version has finished processing; otherwise they would show the previous day.
      - name: Re-run the notebooks on Kaggle
        if: inputs.publish || steps.kaggle.outputs.behind == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # `status` reports the current version: wait until it is newer than before the upload and ready
          for i in $(seq 1 40); do
            # only the JSON line: the CLI can print a warning line before it (see the publish step)
            js=$(kaggle datasets status --format 'json(status,current_version_number)' yasunorim/earth-vital-signs-daily 2>/dev/null | grep '^{' || true)
            echo "status: $js (before upload: version $KAGGLE_PREV_VERSION)"
            ok=$(echo "$js" | jq -r --argjson p "$KAGGLE_PREV_VERSION" 'select(.status == "ready" and .current_version_number > $p) | "ok"' 2>/dev/null || true)
            if [ "$ok" = ok ]; then break; fi
            if [ "$i" = 40 ]; then echo "new dataset version not ready after 20 minutes"; exit 1; fi
            sleep 30
          done
          set -o pipefail
          for nb in notebooks/todays-records notebooks/hottest-year; do
            kaggle kernels push -p "$nb" 2>&1 | tee kernel.log
            if grep -qiE "error|unsuccessful" kernel.log; then exit 1; fi
          done
